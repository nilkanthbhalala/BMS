<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect width="1200" height="780" fill="#f7f9fc"/>
<text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172b4d">Banking System Module and Data Model</text>
<g font-family="Arial" fill="#172b4d">
<rect x="45" y="100" width="270" height="250" rx="12" fill="#e8f1ff" stroke="#3478c8" stroke-width="2"/>
<text x="180" y="132" text-anchor="middle" font-size="21" font-weight="bold">User Roles</text>
<text x="70" y="174" font-size="16">Customer / Joint holder</text><text x="70" y="207" font-size="16">Bank Employee</text><text x="70" y="240" font-size="16">Manager</text><text x="70" y="273" font-size="16">Administrator</text>
<text x="70" y="320" font-size="14" fill="#486581">Credential checks and role permissions</text>
<rect x="365" y="100" width="340" height="250" rx="12" fill="#e9f8ef" stroke="#31915b" stroke-width="2"/>
<text x="535" y="132" text-anchor="middle" font-size="21" font-weight="bold">Service Modules</text>
<text x="390" y="174" font-size="16">customer.c — account, transactions, loan request</text>
<text x="390" y="207" font-size="16">bank_employee.c — assisted transactions</text>
<text x="390" y="240" font-size="16">manager.c — loan review and decision</text>
<text x="390" y="273" font-size="16">administrator.c — staff login management</text>
<text x="390" y="320" font-size="14" fill="#486581">server.c dispatches requests; store.c owns persistence</text>
<rect x="755" y="100" width="400" height="250" rx="12" fill="#fff4df" stroke="#d89422" stroke-width="2"/>
<text x="955" y="132" text-anchor="middle" font-size="21" font-weight="bold">Persistent Records</text>
<text x="780" y="174" font-size="16">Account — holder credentials, balance, status</text>
<text x="780" y="207" font-size="16">Transaction — amount, before/after, actor, time</text>
<text x="780" y="240" font-size="16">Loan — principal, term, status, reviewer</text>
<text x="780" y="273" font-size="16">Staff — employee and manager credentials</text>
<text x="780" y="320" font-size="14" fill="#486581">Fixed-size C records stored in data/*.dat</text>
<path d="M315 225 H355" stroke="#34495e" stroke-width="3"/><path d="M705 225 H745" stroke="#34495e" stroke-width="3"/>
<polygon points="355,225 345,219 345,231" fill="#34495e"/><polygon points="745,225 735,219 735,231" fill="#34495e"/>
<rect x="115" y="430" width="450" height="245" rx="12" fill="#f0eaff" stroke="#7655b5" stroke-width="2"/>
<text x="340" y="465" text-anchor="middle" font-size="21" font-weight="bold">Account and Money Relations</text>
<text x="145" y="510" font-size="17">Account 1 ─── many Transactions</text>
<text x="145" y="550" font-size="17">Account 1 ─── many Loan requests</text>
<text x="145" y="600" font-size="15">Joint account stores two holders in one record.</text>
<text x="145" y="630" font-size="15">A loan approval credits principal and adds a ledger row.</text>
<rect x="635" y="430" width="450" height="245" rx="12" fill="#ffecec" stroke="#c84c4c" stroke-width="2"/>
<text x="860" y="465" text-anchor="middle" font-size="21" font-weight="bold">Financial Commit Path</text>
<text x="665" y="510" font-size="16">1. Lock account, transaction, and journal ranges</text>
<text x="665" y="550" font-size="16">2. Write and fsync the checksummed journal intent</text>
<text x="665" y="590" font-size="16">3. Persist account, ledger, and loan records</text>
<text x="665" y="630" font-size="16">4. Clear and fsync journal; replay it after restart</text>
</g>
</svg>
